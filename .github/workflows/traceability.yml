name: Documentation traceability

on:
  push:
    branches: [main]
  pull_request:

jobs:
  traceability-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build the StrictDoc HTML export
        run: bazel run //:strictdoc -- export "$GITHUB_WORKSPACE" --output-dir="${RUNNER_TEMP}/sdoc-html"

      - name: Build the sphinx-needs HTML export
        run: bazel run //:sphinx-build -- -W -b html "$GITHUB_WORKSPACE/docs_needs" "${RUNNER_TEMP}/needs-html"

      - name: Check traceability (StrictDoc + sphinx-needs, back-to-back)
        run: bazel test //:traceability_tests --test_output=errors
