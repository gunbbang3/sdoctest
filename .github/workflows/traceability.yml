name: Documentation traceability

on:
  push:
    branches: [main]
  pull_request:

jobs:
  traceability-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # Runs //... (7 module unit tests + 2 traceability tests) and
      # //:traceability_reports, then collects both into build/ at the
      # repo root -- the same script a developer runs locally, so CI and
      # local runs produce the same layout. Exits non-zero if any test
      # failed (after still collecting what it could), which fails this
      # step and the job.
      - name: Generate test-result and traceability reports (build/)
        run: scripts/generate_reports.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-traceability-reports
          path: build
          retention-days: 30
